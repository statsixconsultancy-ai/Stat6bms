services:
  # ==============================================================================
  # 1. Backend Microservices Cluster & API Gateway (FastAPI + Groq Copilot Engine)
  # ==============================================================================
  - type: web
    name: stat6bms-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/dev_orchestrator.py
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SUPABASE_URL
        value: https://dawezhpwmjwimrmjmter.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_Zf3NoOJ2GCFErHtPvmIrcg_OQk55ocC
      - key: BMS_JWT_SECRET
        generateValue: true
      - key: BMS_GATEWAY_SECRET
        generateValue: true

  # ==============================================================================
  # 2. Frontend React / Vite Enterprise Management Dashboard
  # ==============================================================================
  - type: static
    name: stat6bms-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: stat6bms-api
          property: host
